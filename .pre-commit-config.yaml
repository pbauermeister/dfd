# Conventional commit messages, checked at commit time. Installed by
# `make require` (pre-commit install --hook-type commit-msg). The type
# list must equal allowed_tags in pyproject.toml; `make lint` checks it.
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, build, chore, ci, style]
