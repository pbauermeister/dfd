[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Add src/ to the Python path so tests can import the package without install
pythonpath = ["src"]
# Discover tests in the tests/ directory
testpaths = ["tests"]

[tool.ruff]
line-length = 80
# Python files only: keep hand-aligned code blocks in Markdown as they are
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.format]
# Keep the quote style as written (was Black's --skip-string-normalization)
quote-style = "preserve"

[tool.ruff.lint]
# Enforce the Type safety section of doc/CONVENTIONS.md on top of the
# default rule set: no Any in annotations, booleans by keyword, at most
# three positional parameters
extend-select = ["ANN401", "FBT", "PLR0917"]

[tool.ruff.lint.pylint]
max-positional-args = 3
