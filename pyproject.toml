[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-flow-diagram"
description = "Commandline tool to generate data flow diagrams from text"
readme = "README.md"
requires-python = ">=3.11, <4"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Pascal Bauermeister", email = "pascal.bauermeister@gmail.com" },
]
keywords = ["diagram-generator", "development", "tool"]
classifiers = [
    # https://pypi.org/classifiers/ :
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
]
dependencies = []
# Bumped by `semantic-release version` (make release), never by hand
version = "1.17.7"

[project.urls]
Homepage = "https://github.com/pbauermeister/dfd"
Source = "https://github.com/pbauermeister/dfd"
"Bug Reports" = "https://github.com/pbauermeister/dfd/issues"

[project.scripts]
data-flow-diagram = "data_flow_diagram:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "pyyaml>=6.0.3",
    "python-semantic-release>=10.6,<11",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Add src/ to the Python path so tests can import the package without install
pythonpath = ["src"]
# Discover tests in the tests/ directory
testpaths = ["tests"]

[tool.ruff]
line-length = 80
# Python files only: keep hand-aligned code blocks in Markdown as they are
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.format]
# Keep the quote style as written (was Black's --skip-string-normalization)
quote-style = "preserve"

[tool.ruff.lint]
# Enforce the Type safety section of doc/CONVENTIONS.md on top of the
# default rule set: no Any in annotations, booleans by keyword, at most
# three positional parameters
extend-select = ["ANN401", "FBT", "PLR0917"]

[tool.ruff.lint.pylint]
max-positional-args = 3

# Release automation: version, CHANGES.md entry, release commit and tag
# are derived from the conventional commits since the last tag, see
# doc/RELEASING.md. The bump map below is the single source of truth
# for the versioning convention (`make help-cc` prints it).
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
commit_parser = "conventional"
build_command = ""

# Any branch: `make show-version` works on a task branch too. Real
# releases are restricted to main by tools/release.sh.
[tool.semantic_release.branches.main]
match = ".*"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "build", "chore", "ci", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "docs", "test", "build"]
# chore, ci and style change nothing the user installs: no bump
default_bump_level = 0
# one PR is one entry: never split a squash body into commits
parse_squash_commits = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- semantic-release -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGES.md"

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.remote]
type = "github"
