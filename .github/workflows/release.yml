name: Release

# Release to PyPI and GitHub from one build, gated on CI. The push of a
# version tag (make release) is the release; a manual dispatch is a dry
# run from any ref, stopping after the TestPyPI rehearsal.
# See engineering/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: data-flow-diagram

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  preflight:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history: the tag must be on main

      - name: Read the version from pyproject.toml
        id: version
        run: echo "version=$(python3 tools/changelog.py print-version)" >> "$GITHUB_OUTPUT"

      - name: Check the tag names the version and is on main
        if: ${{ github.event_name == 'push' }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the version $version of pyproject.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Check the version is on neither PyPI nor TestPyPI
        run: |
          version="${{ steps.version.outputs.version }}"
          for index in pypi.org test.pypi.org; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://$index/pypi/$PACKAGE/$version/json")
            if [ "$code" != 404 ]; then
              echo "::error::$PACKAGE $version on $index: HTTP $code (expected 404)"
              exit 1
            fi
          done

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel in a fresh venv
        run: ./tools/test-installation.sh from-wheel

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/ dist/*

      - name: Smoke-test the TestPyPI install in a fresh venv
        run: ./tools/test-installation.sh from-testpypi

  pypi:
    needs: testpypi
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # no checkout in this job: nothing to cache, no workdir to warn about
          enable-cache: false
          ignore-empty-workdir: true

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [preflight, pypi]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create the GitHub release on the tag
        run: |
          python3 tools/changelog.py print-notes > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/*.whl dist/*.tar.gz
