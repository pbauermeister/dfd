name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # called as the gate of release.yml
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: make require-system

      - name: Run tests and lint
        run: make test lint

  smoke-test-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and install it in a fresh venv
        run: make smoke-test-wheel
