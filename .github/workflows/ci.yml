name: CI

# Commits confined to bookkeeping paths (BOOKKEEPING_PATHS in
# tools/conventional-commits.py; `make lint` keeps the lists equal) run
# nothing: CI is not a required check of the main ruleset, so a skipped
# run does not block a merge. The workflow_call trigger stays unfiltered:
# release.yml always gates on the suite.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "TODO.md"
      - "CLAUDE.md"
      - ".claude/**"
      - "devlog/**"
      - "discussions/**"
      - "engineering/**"
      - "templates/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "TODO.md"
      - "CLAUDE.md"
      - ".claude/**"
      - "devlog/**"
      - "discussions/**"
      - "engineering/**"
      - "templates/**"
  # called as the gate of release.yml
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: make require-system

      - name: Run tests and lint
        run: make test lint

  smoke-test-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheel and install it in a fresh venv
        run: make smoke-test-wheel
